name: Update exam manifest
on:
  push:
    paths:
      - 'exams/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json from exams folder
        run: |
          cd exams
          printf '%s\n' *.js | jq -R -s -c 'split("\n") | map(select(length > 0))' > ../manifest.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Auto-update exam manifest"
          git push
